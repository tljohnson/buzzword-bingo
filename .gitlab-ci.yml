stages: [validate, test]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

source-check:
  stage: validate
  image: alpine:latest
  tags: [shared]
  script:
    - test -f BuzzwordBingo.xcodeproj/project.pbxproj
    - test -f BuzzwordBingo/PrivacyInfo.xcprivacy
    - test -f BuzzwordBingo/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
    - '! git ls-files | grep -E "(^|/)(\.env|[^/]+\.(p12|mobileprovision|key|pem))$"'

# Configure a macOS shell runner with BOTH tags; iOS SDKs cannot run in Linux Docker.
ios-tests:
  stage: test
  tags: [shared, macos]
  script:
    - xcodebuild test -project BuzzwordBingo.xcodeproj -scheme BuzzwordBingo -destination "platform=iOS Simulator,name=${IOS_SIMULATOR_NAME:-iPhone 17 Pro}" -derivedDataPath build/DerivedData -resultBundlePath build/Tests.xcresult -enableCodeCoverage YES -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
    - xcrun xccov view --report --json build/Tests.xcresult > build/coverage.json
    - swift tools/CheckCoverage.swift build/coverage.json
  artifacts:
    when: always
    paths: [build/Tests.xcresult, build/coverage.json]
